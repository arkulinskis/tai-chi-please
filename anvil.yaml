        order: 10
        width: 200
      client_hidden: false
      name: last_seen
      type: datetime
    - admin_ui:
        order: 11
        width: 200
      client_hidden: false
      name: legal_version
      type: string
    - admin_ui:
        order: 12
        width: 200
      client_hidden: false
      name: legal_accepted_at
      type: datetime
    - admin_ui:
        order: 13
        width: 200
      client_hidden: false
      name: legal_source
      type: string
    - admin_ui:
        order: 14
        width: 200
      client_hidden: false
      name: prefs
      type: simpleObject
    indexes: []
    server: full
    title: Users
metadata:
  description: 'A gentle morning tai chi practice in a bamboo forest: guided sessions with a 3D teacher, lymph self-massage,
    and a path through the 24-step form. Start without signing up.'
  logo_img: asset:icon-512.png
  title: Tai Chi Please · morning tai chi in the bamboo forest
name: Tai Chi Please
native_deps:
  head_html: "<script src=\"_/theme/legal-kit.js?v=c80ae40034\"></script>\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#2e6a44\">\n<meta name=\"apple-mobile-web-app-capable\"\
    \ content=\"yes\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"\
    https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=Shippori+Mincho+B1:wght@600;700;800&family=Noto+Serif+SC:wght@500;700&display=swap\"\
    \ rel=\"stylesheet\">\n<link id=\"ui-favicon\" rel=\"icon\" type=\"image/svg+xml\" href=\"_/theme/icon.svg?v=6d3ede7aba\"\
    >\n<link rel=\"apple-touch-icon\" href=\"_/theme/icon-180.png?v=6d3ede7aba\">\n<script>\n/* Keep our tab icon: Anvil adds\
    \ its own <link rel=\"icon\">, so drop any other icon link. */\n(function () {\n  function keep() {\n    var ours = document.getElementById('ui-favicon');\n\
    \    if (!ours) return;\n    document.querySelectorAll('link[rel~=\"icon\"]').forEach(function (l) { if (l !== ours) l.remove();\
    \ });\n  }\n  keep();\n  document.addEventListener('DOMContentLoaded', keep);\n  window.addEventListener('load', keep);\n\
    })();\n</script>\n\n<!-- Prepsto feedback panel: every \"Submit feedback\" link and button opens it (it is the only feedback\
    \ channel). No floating button, no cookies, nothing loads until it is opened. Codes: APP_MAKER/prepsto-links.json -->\n\
    <script src=\"https://prepsto.com/_/theme/widget.js\" data-prepsto=\"dudgtyt\" data-button=\"false\" data-label=\"Submit\
    \ feedback\" async></script>\n<link rel=\"stylesheet\" href=\"_/theme/app.css?v=9da28c7360\">\n<script src=\"_/theme/app.js?v=e1147be566\"\
    ></script>\n"
package_name: Tai_Chi_Please
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
startup:
  module: Main
  type: form
