    - admin_ui:
        order: 6
        width: 200
      name: status
      type: string
    - admin_ui:
        order: 7
        width: 200
      name: note
      type: string
    - admin_ui:
        order: 8
        width: 200
      name: created
      type: datetime
    indexes: []
    server: full
    title: Feedback
  sessions:
    client: none
    columns:
    - admin_ui:
        order: 0
        width: 200
      name: user
      target: users
      type: link_single
    - admin_ui:
        order: 1
        width: 200
      name: day
      type: string
    - admin_ui:
        order: 2
        width: 200
      name: created
      type: datetime
    - admin_ui:
        order: 3
        width: 200
      name: minutes
      type: number
    - admin_ui:
        order: 4
        width: 200
      name: kind
      type: string
    - admin_ui:
        order: 5
        width: 200
      name: title
      type: string
    - admin_ui:
        order: 6
        width: 200
      name: moves
      type: simpleObject
    - admin_ui:
        order: 7
        width: 200
      name: feel_before
      type: number
    - admin_ui:
        order: 8
        width: 200
      name: feel_after
      type: number
    - admin_ui:
        order: 9
        width: 200
      name: note
      type: string
    - admin_ui:
        order: 10
        width: 200
      name: source
      type: string
    - admin_ui:
        order: 11
        width: 200
      name: is_demo
      type: bool
    indexes: []
    server: full
    title: Sessions
  users:
    client: none
    columns:
    - admin_ui:
        order: 0
        width: 200
      client_hidden: false
      name: email
      type: string
    - admin_ui:
        order: 1
        width: 200
      client_hidden: true
      name: enabled
      type: bool
    - admin_ui:
        order: 2
        width: 200
      client_hidden: true
      name: last_login
      type: datetime
    - admin_ui:
        order: 3
        width: 200
      client_hidden: true
      name: password_hash
      type: string
    - admin_ui:
        order: 4
        width: 200
      client_hidden: true
      name: n_password_failures
      type: number
    - admin_ui:
        order: 5
        width: 200
      client_hidden: true
      name: confirmed_email
      type: bool
    - admin_ui:
        order: 6
        width: 200
      client_hidden: true
      name: signed_up
      type: datetime
    - admin_ui:
        order: 7
        width: 200
      client_hidden: false
      name: display_name
      type: string
    - admin_ui:
        order: 8
        width: 200
      client_hidden: false
