<div class="ir-host" role="listitem">
  <div class="ir-head" anvil:name="head_row"><span class="tc-cat"><i class="ic" anvil:name="cat_icon"></i><anvil-component type="Label" name="cat_name" prop:role='["inherit"]'></anvil-component></span></div>
  <div class="ir-row" anvil:name="step_row">
    <anvil-component type="Label" name="name" prop:role='["inherit"]'></anvil-component>
    <anvil-component type="Label" name="new_badge" prop:text="New move" prop:role='["badge", "badge-brand"]'></anvil-component>
    <anvil-component type="Label" name="t" prop:role='["ir-t"]'></anvil-component>
  </div>
</div>
