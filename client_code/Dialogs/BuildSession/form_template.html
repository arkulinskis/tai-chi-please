<div class="ui build-session">
  <p class="muted">Tick the moves you want, in any order you like; they play in the order shown. About a minute each.</p>
  <div class="pr-pick">
    <anvil-component type="RepeatingPanel" name="cats" prop:item_template="Tai_Chi_Please.Items.PickCat" prop:role='["contents"]'></anvil-component>
  </div>
  <div class="ui-row end pr-pick-foot">
    <anvil-component type="Label" name="count" prop:text="Nothing picked yet" prop:role='["fine-print"]'></anvil-component>
    <span class="ui-spacer"></span>
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="start_button" prop:text="Start" prop:enabled="false" prop:role='["btn", "btn-primary", "ic-play"]'></anvil-component>
  </div>
</div>
