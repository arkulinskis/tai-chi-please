<anvil-form layout="Tai_Chi_Please.Layouts.Shell">
  <anvil-block slot="content">
    <div class="ui-wrap ui-narrow">
      <div class="pf-head">
        <anvil-component type="Label" name="initials" prop:role='["pf-avatar"]'></anvil-component>
        <div>
          <anvil-component type="Label" name="name_title" prop:role='["pf-title"]'></anvil-component>
          <anvil-component type="Label" name="email_line" prop:role='["fine-print"]'></anvil-component>
        </div>
      </div>
      <div class="pf-grid">
        <div class="ui-card ui-stack">
          <h3>Your name</h3>
          <label class="ui-field"><span>Shown to other people</span>
            <anvil-component type="TextBox" name="name_box"></anvil-component>
          </label>
          <anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-primary"]'></anvil-component>
        </div>
        <div class="ui-card ui-stack">
          <h3>Appearance</h3>
          <p class="muted small">Follow your device, or pick one.</p>
          <div class="ui-seg">
            <button type="button" anvil:name="theme_auto" data-theme-pick="auto" anvil:on-dom:click="self.theme_click">Auto</button>
            <button type="button" anvil:name="theme_light" data-theme-pick="light" anvil:on-dom:click="self.theme_click">Light</button>
            <button type="button" anvil:name="theme_dark" data-theme-pick="dark" anvil:on-dom:click="self.theme_click">Dark</button>
          </div>
          <h3 class="pf-pw">Password</h3>
          <p class="muted small">We'll email you a link to choose a new one.</p>
          <anvil-component type="Button" name="reset_button" prop:text="Email me a reset link" prop:role='["btn", "ic-mail"]'></anvil-component>
        </div>
      </div>
      <div class="ui-card pf-practice">
        <h3>Your practice</h3>
        <div class="pf-grid">
          <div class="ui-stack">
            <div><b>Morning flow length</b>
              <div class="ui-seg pf-seg" role="group" aria-label="Morning flow length">
                <anvil-component type="Button" name="len7" prop:text="7 min" prop:role='["seg"]'></anvil-component>
                <anvil-component type="Button" name="len15" prop:text="15 min" prop:role='["seg"]'></anvil-component>
                <anvil-component type="Button" name="len25" prop:text="25 min" prop:role='["seg"]'></anvil-component>
              </div>
            </div>
            <label class="ui-field"><span>Morning time <em>(for the calendar reminder)</em></span>
              <anvil-component type="TextBox" name="time_box" prop:role='["pf-time"]'></anvil-component>
            </label>
            <div>
              <anvil-component type="Button" name="ics_button" prop:text="Add a daily reminder to my calendar" prop:role='["btn", "ic-download"]'></anvil-component>
              <anvil-component type="Label" name="ics_hint" prop:role='["fine-print", "pf-hint"]'></anvil-component>
            </div>
          </div>
          <div class="pf-toggles">
            <anvil-component type="CheckBox" name="t_voice" prop:text="Spoken guidance" prop:role='["switch"]'></anvil-component>
            <anvil-component type="CheckBox" name="t_bell" prop:text="Bell between steps" prop:role='["switch"]'></anvil-component>
            <anvil-component type="CheckBox" name="t_wind" prop:text="Forest sound" prop:role='["switch"]'></anvil-component>
            <anvil-component type="CheckBox" name="t_mirror" prop:text="Mirror the teacher" prop:role='["switch"]'></anvil-component>
            <span class="pf-hint-line">Move as if facing a mirror</span>
            <anvil-component type="CheckBox" name="t_trails" prop:text="Hand trails" prop:role='["switch"]'></anvil-component>
            <anvil-component type="CheckBox" name="t_circle" prop:text="Show my first name in the morning circle" prop:role='["switch"]'></anvil-component>
            <span class="pf-hint-line">Otherwise you are counted anonymously</span>
          </div>
        </div>
      </div>
      <div class="ui-card pf-more">
        <div class="pf-links">
          <a href="#journal"><i class="ic ic-calendar"></i>Your journal</a>
          <a href="#admin" anvil:name="admin_link"><i class="ic ic-shield"></i>Admin</a>
          <button type="button" anvil:on-dom:click="self.feedback_click"><i class="ic ic-chat"></i>Submit feedback</button>
          <button type="button" data-lk-open="overview"><i class="ic ic-lock"></i>Privacy &amp; Terms, and your data</button>
          <button type="button" anvil:on-dom:click="self.sign_out_click"><i class="ic ic-logout"></i>Sign out</button>
        </div>
      </div>
    </div>
  </anvil-block>
</anvil-form>
